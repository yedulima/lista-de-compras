<!doctype html>
<html lang="pt-br">
	<!-- prettier-ignore -->
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lista de Compras</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Krona+One&family=Montserrat&family=Numans&display=swap" rel="stylesheet" />
		<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
		<link rel="stylesheet" href="src/root.css" />
	</head>

	<body>
		<main>
			<img
				src="https://i.pinimg.com/originals/fc/9d/ff/fc9dfff31121e22216be786dc7a2ee5f.jpg"
			/>
			<form>
				<input
					class="input-item"
					id="input-item"
					type="text"
					placeholder="Digite o item que deseja adicionar"
				/>
				<button
					class="button-item"
					id="adicionar-item"
					type="button"
				>
					Salvar item
				</button>
			</form>

			<div class="container-lista">
				<h2>Lista de compras</h2>
				<hr />

				<ul id="lista-de-compras">
					<li class="lista-container">
						<div>
							<div class="lista-item-container">
								<input
									type="checkbox"
									id="checkbox-1"
								/>
								<p>Ração de gato</p>
							</div>
							<p class="texto-data">Segunda-feira (31/10/2022) às 08:30</p>
						</div>
						<button class="button-excluir-item">
							<span
								class="mdi mdi-trash-can-outline mdi-24px"
								style="color: red"
							></span>
						</button>
					</li>
				</ul>
			</div>
		</main>
		<script
			type="module"
			src="/src/main.js"
		></script>
	</body>
</html>
